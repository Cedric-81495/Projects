# Render blueprint. Secrets are set in the dashboard, never here.
services:
  - type: web
    name: h2c-api
    runtime: node
    plan: starter
    # --include=dev is required: Render sets NODE_ENV=production, which makes
    # npm skip devDependencies — and typescript, tsup, and @types/node all live
    # there. Without it the build has no compiler and no type definitions.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # sync:false means "prompt me in the dashboard" — these never enter git.
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false
      - key: VERCEL_DEPLOY_HOOK_URL
        sync: false
