# Render Blueprint for the H2C frontend (static site).
# Deploy: New + > Blueprint, point at this repo. Render reads this file.
services:
  - type: web
    runtime: static
    name: h2c-web
    # If this repo is a monorepo with the frontend in a subfolder, set:
    # rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      # Point this at your deployed Express API. Leave unset to run on seed data.
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # SPA history fallback — every path serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
